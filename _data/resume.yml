# Intro paragraph rendered on the home page. HTML allowed.
intro: |
  Hi, I'm Alberto. I'm a <strong>Senior Associate in Machine Learning</strong> at
  <strong>J.P. Morgan's ML Centre of Excellence</strong> in New York, on the Time Series
  and Reinforcement Learning team.

  Before that, I did my Ph.D. at <strong>UC Berkeley IEOR</strong>, advised by
  <strong>Prof. Thibaut Mastrolia</strong>, on stochastic optimal control under model and
  time uncertainty. My research now centers on control and reinforcement learning for
  path-dependent systems with jumps, where path signatures do much of the work.

  Earlier I studied Mathematical Engineering at <strong>Politecnico di Torino</strong> and
  Statistics and Applied Math at <strong>Collegio Carlo Alberto</strong>, where I worked on
  stochastic programming.

  Outside of work you'll find me on a tennis court or a golf course, or trying to learn
  something new. If you work in RL or time series, I'd love to hear from you at
  <span class="mono">alberto (dot) gennaro (at) berkeley (dot) edu</span>.

