# Research interests: Research page section and the home-page card.
research_interests:
  intro: |
    I work on control and reinforcement learning for systems whose state is a whole path
    rather than a point. Decisions depend on the history of the process, and that history
    jumps: orders arrive in bursts, defaults happen, regimes switch. Path signatures give a
    model-agnostic way to describe such histories, including paths with jumps, and they are
    the common thread of my recent work.
  themes:
    - title: "Control and RL on path space"
      text: "Policies that read the signature of the observed history, for non-Markovian problems where no small state summarizes the past."
      short: "Control and RL on path space, with signature-based policies."
    - title: "Jumps and event streams"
      text: "Signatures of paths with jumps and point processes, with self-exciting (Hawkes) order flow and market making as a running example."
      short: "Jumps and event streams: point processes and order flow."
    - title: "Robustness to the model and the clock"
      text: "Control under uncertainty in the volatility and in the time horizon, through second-order BSDEs."
      short: "Robust control under model and horizon uncertainty, via 2BSDEs."

