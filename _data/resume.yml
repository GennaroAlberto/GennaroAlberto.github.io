    authors: "A. Gennaro, T. Mastrolia, F. Primavera"
    venue: "ICAIF '26, ACM International Conference on AI in Finance, Milan · Oral presentation · arXiv:2606.19772"
    year: 2026
    status: "oral"
    summary: "Bid and ask quotes for a mean–variance market maker, learned as functions of the signature of the order-flow path. The problem reduces to a pseudo-linear optimization over the expected signature, solved with Sig-REINFORCE under Poisson and Hawkes order flow and benchmarked against PPO."
